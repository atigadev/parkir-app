<!doctype html>
<!-- Uji kesamaan mesin tarif JS dengan kasus di tarif_cases.json.
     Buka lewat browser (http://localhost/parkit-app/tests/tarif_parity.html tidak bisa karena folder tests diblokir),
     jalankan dengan: chrome --headless --allow-file-access-from-files --dump-dom file:///.../tests/tarif_parity.html -->
<html><head><meta charset="utf-8"><title>Tarif parity</title></head>
<body><pre id="out">running</pre>
<script src="../pwa/js/tarif.js"></script>
<script src="tarif_cases.js"></script>
<script>
var out = [], gagal = 0;
CASES.cases.forEach(function (c) {
  var r = Tarif.hitung(CASES.tarif[c.tarif], c.masuk, c.keluar, c.khusus || null, c.denda || 0);
  var ok = r.total === c.harapan;
  if (!ok) gagal++;
  out.push((ok ? 'OK    ' : 'GAGAL ') + c.nama + '  total=' + r.total + ' harapan=' + c.harapan);
});
out.push(gagal ? gagal + ' kasus gagal' : 'Semua kasus lulus (JS)');
document.getElementById('out').textContent = out.join('\n');
</script>
</body></html>
